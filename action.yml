name: Environment selection
description: Select environment and parse schema based on context and configuration

inputs:
  schema:
    required: true
    description: The schema which should be parsed
  deploy:
    required: false
    description: The manual deployment input value
  path:
    required: false
    description: The path to the configuration
  environment:
    required: false
    description: The environment which can be set to overwrite the environment determination process

outputs:
  json:
    description: The output JSON representation of the selected schema
    value: ${{ steps.environment.outputs.json }}

runs:
  using: composite
  steps:
    - name: Demo sample output
      id: environment
      shell: bash
      env:
        INPUT_SCHEMA: ${{ inputs.schema }}
        INPUT_DEPLOY: ${{ inputs.deploy }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_ENV: ${{ inputs.environment }}
      run: |
        echo "Running configuration parser demo with inputs..."

        # Safely output JSON using jq to handle escaping and empty values automatically
        jq -n \
          --arg schema "$INPUT_SCHEMA" \
          --arg deploy "$INPUT_DEPLOY" \
          --arg path "$INPUT_PATH" \
          --arg environment "$INPUT_ENV" \
          '{schema: $schema, deploy: $deploy, path: $path, environment: $environment}' > output.json

        echo "Output JSON:"
        cat output.json

        echo "Setting output variable 'json' with the generated JSON."
        {
          echo "json<<EOF"
          cat output.json
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
