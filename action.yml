name: Environment selection
description: Select environment and parse schema based on context and configuration

inputs:
  schema:
    required: true
    description: The schema which should be parsed
  deploy:
    required: false
    description: The manual deployment input value
  path:
    required: false
    description: The path to the configuration
  environment:
    required: false
    description: The environment which can be set to overwrite the environment determination process

outputs:
  json:
    description: The output JSON representation of the selected schema
    value: ${{ steps.environment.outputs.json }}

runs:
  using: composite
  steps:
    - name: Parse YAML configuration
      id: environment
      shell: bash
      env:
        WORKSPACE: ${{ github.workspace }}
        INPUT_SCHEMA: ${{ inputs.schema }}
        INPUT_PATH: ${{ inputs.path }}
      run: |
        CONFIG_FILE=""

        # 1. Resolve path when inputs.path is provided
        if [ -n "$INPUT_PATH" ]; then
          # Handle whether input.path is already absolute or relative to workspace
          if [[ "$INPUT_PATH" = /* ]]; then
            TARGET_BASE="$INPUT_PATH"
          else
            TARGET_BASE="$WORKSPACE/$INPUT_PATH"
          fi

          if [ -f "$TARGET_BASE" ]; then
            CONFIG_FILE="$TARGET_BASE"
          elif [ -f "$TARGET_BASE/$INPUT_SCHEMA" ]; then
            CONFIG_FILE="$TARGET_BASE/$INPUT_SCHEMA"
          elif [ -f "$TARGET_BASE/$INPUT_SCHEMA.yml" ]; then
            CONFIG_FILE="$TARGET_BASE/$INPUT_SCHEMA.yml"
          elif [ -f "$TARGET_BASE/$INPUT_SCHEMA.yaml" ]; then
            CONFIG_FILE="$TARGET_BASE/$INPUT_SCHEMA.yaml"
          fi
        fi

        # 2. Fall back to absolute default locations within github.workspace
        if [ -z "$CONFIG_FILE" ]; then
          DEFAULT_DIR="$WORKSPACE/.github/configs"
          
          if [ -f "$DEFAULT_DIR/$INPUT_SCHEMA.yml" ]; then
            CONFIG_FILE="$DEFAULT_DIR/$INPUT_SCHEMA.yml"
          elif [ -f "$DEFAULT_DIR/$INPUT_SCHEMA.yaml" ]; then
            CONFIG_FILE="$DEFAULT_DIR/$INPUT_SCHEMA.yaml"
          elif [ -f "$DEFAULT_DIR/$INPUT_SCHEMA" ]; then
            CONFIG_FILE="$DEFAULT_DIR/$INPUT_SCHEMA"
          elif [ -f "$WORKSPACE/$INPUT_SCHEMA.yml" ]; then
            CONFIG_FILE="$WORKSPACE/$INPUT_SCHEMA.yml"
          fi
        fi

        if [ -z "$CONFIG_FILE" ] || [ ! -f "$CONFIG_FILE" ]; then
          echo "::error::Could not locate YAML file for '$INPUT_SCHEMA' under workspace root: $WORKSPACE"
          exit 1
        fi

        echo "Parsing YAML file from absolute path: $CONFIG_FILE"

        # Convert YAML content directly to JSON using yq
        JSON_DATA=$(yq -o=json '.' "$CONFIG_FILE")

        echo "Output JSON:"
        echo "$JSON_DATA"

        {
          echo "json<<EOF"
          echo "$JSON_DATA"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
