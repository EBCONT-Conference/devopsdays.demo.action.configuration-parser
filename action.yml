name: Environment selection
description: Select environment and parse schema based on context and configuration

inputs:
  schema:
    required: true
    description: The schema which should be parsed
  deploy:
    required: false
    description: The manual deployment input value
  path:
    required: false
    description: The path to the configuration
  environment:
    required: false
    description: The environment which can be set to overwrite the environment determination process

outputs:
  json:
    description: The output JSON representation of the selected schema
    value: ${{ steps.environment.outputs.json }}

runs:
  using: composite
  steps:
    - name: Parse YAML configuration
      id: environment
      shell: bash
      env:
        INPUT_SCHEMA: ${{ inputs.schema }}
        INPUT_PATH: ${{ inputs.path }}
      run: |
        CONFIG_FILE=""

        if [ -n "$INPUT_PATH" ]; then
          if [ -f "$INPUT_PATH" ]; then
            CONFIG_FILE="$INPUT_PATH"
          elif [ -f "$INPUT_PATH/$INPUT_SCHEMA.yml" ]; then
            CONFIG_FILE="$INPUT_PATH/$INPUT_SCHEMA.yml"
          elif [ -f "$INPUT_PATH/$INPUT_SCHEMA.yaml" ]; then
            CONFIG_FILE="$INPUT_PATH/$INPUT_SCHEMA.yaml"
          fi
        fi

        # Default fallback searches if path was not explicitly specified or resolved
        if [ -z "$CONFIG_FILE" ]; then
          if [ -f ".github/configs/$INPUT_SCHEMA.yml" ]; then
            CONFIG_FILE=".github/configs/$INPUT_SCHEMA.yml"
          elif [ -f ".github/configs/$INPUT_SCHEMA.yaml" ]; then
            CONFIG_FILE=".github/configs/$INPUT_SCHEMA.yaml"
          elif [ -f ".github/configs/$INPUT_SCHEMA" ]; then
            CONFIG_FILE=".github/configs/$INPUT_SCHEMA"
          elif [ -f "$INPUT_SCHEMA.yml" ]; then
            CONFIG_FILE="$INPUT_SCHEMA.yml"
          fi
        fi

        if [ -z "$CONFIG_FILE" ] || [ ! -f "$CONFIG_FILE" ]; then
          echo "::error::Could not locate YAML configuration file for schema '$INPUT_SCHEMA'."
          exit 1
        fi

        echo "Parsing YAML file: $CONFIG_FILE"

        # 2. Convert YAML content directly to JSON using yq
        JSON_DATA=$(yq -o=json '.' "$CONFIG_FILE")

        # 3. Print output to console log
        echo "Output JSON:"
        echo "$JSON_DATA"

        # 4. Multiline output export to GITHUB_OUTPUT
        {
          echo "json<<EOF"
          echo "$JSON_DATA"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
